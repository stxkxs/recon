# Docker Compose for recon - Infrastructure reconnaissance toolkit
#
# Usage:
#   docker-compose run --rm recon example.com
#   docker-compose run --rm recon --json example.com
#   docker-compose run --rm recon --batch /data/targets.txt
#

services:
  recon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: recon:latest
    container_name: recon
    user: recon

    # Mount volumes for persistent data
    volumes:
      # Results output directory
      - ./results:/home/recon/.local/share/recon/results

      # State directory for batch processing
      - ./state:/home/recon/.local/share/recon/state

      # Custom config (optional)
      - ./config:/home/recon/.config/recon:ro

      # Input files for batch processing
      - ./data:/data:ro

    # Environment variables
    environment:
      - RECON_OUTPUT_FORMAT=${RECON_OUTPUT_FORMAT:-terminal}
      - RECON_COLOR=${RECON_COLOR:-auto}
      - RECON_DEBUG=${RECON_DEBUG:-0}
      # API keys (optional)
      - RECON_API_SHODAN=${RECON_API_SHODAN:-}
      - RECON_API_SECURITYTRAILS=${RECON_API_SECURITYTRAILS:-}

    # Network settings
    networks:
      - recon-net

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777

    # Default command (override with docker-compose run)
    command: ["--help"]

  # Batch processing service with extended resources
  recon-batch:
    extends:
      service: recon
    container_name: recon-batch
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 256M
    # Keep running for batch operations
    stdin_open: true
    tty: true
    command: ["--batch", "/data/targets.txt", "--parallel", "4"]

networks:
  recon-net:
    driver: bridge

